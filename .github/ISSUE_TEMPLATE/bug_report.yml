name: Report a bug
description: Report a problem with the affected app.
body:
  - type: markdown
    attributes:
      value: Search existing issues first. Reports are public. Remove private links, room codes, tokens, and personal information from screenshots or logs.
  - type: dropdown
    id: project
    attributes:
      label: Project
      options:
        - Daylist Beta
        - My Mix
        - Shoresh
        - Tab Snooze
    validations:
      required: true
  - type: input
    id: setup
    attributes:
      label: Setup
      description: "Project, version if shown, and browser or operating system"
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
    validations:
      required: true
  - type: textarea
    id: behavior
    attributes:
      label: What happened, and what did you expect?
    validations:
      required: true
